# CI for the AI Receptionist platform, which lives in ai-receptionist/.
# GitHub only reads workflows from .github/ at the repository root, so this
# file is here and every job works inside ai-receptionist/:
# - `run:` steps start there (the `defaults` below);
# - a step's own `working-directory`, and setup actions' `cache-dependency-path`,
#   are resolved from the repository root, so those spell out the prefix.
# If ai-receptionist/ becomes a repository of its own, move this file into its
# .github/workflows/ and drop the prefix and the paths filters.
#
# Deploys are not a job here: Railway and Vercel deploy from the connected
# branch, and Railway's "Wait for CI" setting holds a deploy until this
# workflow is green (see ai-receptionist/infra/railway/README.md).
name: ai-receptionist ci

# Only changes to the platform (or to this file) run it. If a branch
# protection rule ever requires these checks, note that a PR touching neither
# never gets them and would wait forever: require them only together with a
# rule that understands skipped path-filtered workflows.
on:
  push:
    branches: [main]
    paths: ["ai-receptionist/**", ".github/workflows/ai-receptionist-ci.yml"]
  pull_request:
    paths: ["ai-receptionist/**", ".github/workflows/ai-receptionist-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The application role the bootstrap script creates. Tests and the image run
  # as this role, never as the Postgres admin: superusers bypass row-level
  # security, and the tenant-isolation tests fail if that is ever the case.
  APP_DB_PASSWORD: ci-only-password
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/receptionist
  DATABASE_URL: postgresql+asyncpg://receptionist_app:ci-only-password@localhost:5432/receptionist
  REDIS_URL: redis://localhost:6379/0

defaults:
  run:
    working-directory: ai-receptionist

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receptionist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-receptionist/apps/api/requirements.lock
      - name: Install (pinned to the same versions the image ships)
        run: pip install -e "apps/api[dev]" -c apps/api/requirements.lock
      - name: Lint
        run: |
          ruff check apps/api
          ruff format --check apps/api
      - name: Type check
        working-directory: ai-receptionist/apps/api
        run: mypy src
      - name: Create the restricted application role
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_DB_PASSWORD" \
            -f infra/postgres/bootstrap-managed.sql
      - name: Migrate
        working-directory: ai-receptionist/apps/api
        run: alembic upgrade head
      - name: Test
        working-directory: ai-receptionist/apps/api
        run: pytest -q

  postgres-image:
    # The self-run database image (infra/postgres/image): Postgres, pgvector
    # and pgBackRest from Ubuntu's packages. pgvector here differs from the
    # api job's (pgvector/pgvector:pg16), so the whole suite runs against the
    # image too: production's database engine is the one that was tested.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-receptionist/apps/api/requirements.lock
      - name: Install
        run: pip install -e "apps/api[dev]" -c apps/api/requirements.lock
      - name: Build image
        run: docker build -f infra/postgres/image/Dockerfile -t receptionist-postgres:ci infra
      - name: Smoke test the image, and leave it running
        run: KEEP=1 infra/scripts/smoke-postgres-image.sh receptionist-postgres:ci
      - name: Migrate
        working-directory: ai-receptionist/apps/api
        run: alembic upgrade head
      - name: Test against the image
        working-directory: ai-receptionist/apps/api
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Replaces the workflow default for this job, so it is repo-relative.
        working-directory: ai-receptionist/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-receptionist/apps/dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build

  image:
    # Builds the production image and runs it the way a deploy does: migrate,
    # boot the API and all three workers in production mode, check health and
    # security headers, then SIGTERM everything and require clean exits.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receptionist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t receptionist-api:ci apps/api
      - name: Create the restricted application role
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_DB_PASSWORD" \
            -f infra/postgres/bootstrap-managed.sql
      - name: Smoke test the image
        run: infra/scripts/smoke-image.sh receptionist-api:ci
