services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Bootstrap superuser only. The application connects as the separate,
      # non-superuser `receptionist` role created by the init script below —
      # superusers bypass RLS, which would silently void tenant isolation.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receptionist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on an empty data volume. After changing it:
      # docker compose down -v && docker compose up -d postgres
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@postgres:5432/receptionist
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as `api`, different role (see apps/api/docker-entrypoint.sh).
  # Separate processes on purpose: confirmations must keep draining when
  # post-call summarization is backed up behind a slow LLM.
  worker: &worker
    build:
      context: apps/api
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@postgres:5432/receptionist
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  confirmations:
    <<: *worker
    command: ["confirmations"]

  crm:
    <<: *worker
    command: ["crm"]

volumes:
  pgdata:
