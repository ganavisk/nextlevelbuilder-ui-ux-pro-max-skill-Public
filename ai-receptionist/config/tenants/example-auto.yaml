# Example tenant: an independent auto repair shop.
#
# Everything that makes this an auto shop rather than a dental practice is
# configuration in this file — no code is specific to auto repair:
#   - three service bays (scheduling.bays), so up to three jobs run at once
#   - the vehicle details collected at booking (scheduling.booking_fields)
#   - a safety rule for vehicles that should not be driven (agent.persona):
#     the caller's own safety first, then the 24-hour tow line, then an
#     URGENT callback with an honest after-hours promise (escalation)
#
# Seed it:      cd apps/api && ../../.venv/bin/python scripts/seed_demo.py \
#                 ../../config/tenants/example-auto.yaml --number +15550100003
# Provision it: make provision SLUG=ridgeline-auto-care

tenant:
  slug: ridgeline-auto-care
  name: Ridgeline Auto Care
  vertical: auto_repair
  timezone: America/Denver
  business_hours:
    mon: [["07:30", "18:00"]]
    tue: [["07:30", "18:00"]]
    wed: [["07:30", "18:00"]]
    thu: [["07:30", "18:00"]]
    fri: [["07:30", "18:00"]]
    sat: [["08:00", "14:00"]]

agent:
  # ElevenLabs library voice "Odom - Friendly, Real, Conversational": steady,
  # patient American male, described for customer service, technical support
  # and scheduling. A library voice may need adding to your ElevenLabs voices
  # before Vapi can use it (see docs/runbooks/connecting-the-voice-system.md).
  voice_provider: 11labs
  voice_id: B9VuHWRTj36519FJw8J0
  voice_model: eleven_turbo_v2_5
  language: en
  first_message: >-
    Thanks for calling Ridgeline Auto Care. This call may be recorded. I'm
    Jordan, the shop's virtual assistant. Are you looking to book a service, or
    can I answer a question?
  persona: >-
    Friendly, practical service advisor for an independent auto repair shop.
    Books appointments, answers questions about services, starting prices,
    hours, loaners and warranty from the knowledge base only, and keeps it
    short: callers are often on the road. Never diagnoses a problem or quotes a
    final repair price; explain that a technician inspects the vehicle first
    and the shop calls with an estimate before any work.
    SAFETY: if the caller describes brakes that are failing or grinding to
    metal, smoke or a burning smell, the temperature gauge in the red, a
    flashing check-engine light, a fuel smell, or steering that feels loose,
    look after the person before the car. First ask whether they're somewhere
    safe; if they're on the road, ask them to pull over out of traffic if they
    can do it safely. If there is smoke, flames or a strong fuel smell, tell
    them to get away from the vehicle and call 911 now. Then tell them plainly
    not to keep driving it, give them Summit Towing's 24-hour number, saying it
    slowly as "5 5 5, 0 1 4, 2 2 0 0", and offer to repeat it. Then use
    request_callback with the reason starting "URGENT".
  forbidden_topics:
    - diagnosing a mechanical problem over the phone
    - final repair prices or guarantees before an inspection
    - legal advice about accidents or insurance claims

qualification:
  - key: vehicle
    question: "What's the year, make and model of the vehicle?"
    type: text
  - key: concern
    question: "What's going on with it, or what service is it due for?"
    type: text
  - key: safe_to_drive
    question: "Can you drive it in, or will it need a tow?"
    type: choice
    options: [drivable, needs_tow]
    scoring: { needs_tow: 40 }      # stranded customer: highest priority
  - key: warning_light
    question: "Are any warning lights on, like the check-engine light?"
    type: boolean
    scoring: { true: 20 }
  - key: returning_customer
    question: "Have we worked on this vehicle before?"
    type: boolean

knowledge:
  - title: "Hours, location and drop-off"
    content: >-
      We are open Monday to Friday 7:30am to 6pm and Saturday 8am to 2pm,
      closed Sundays. We're at 2140 Ridgeline Drive. Early drop-off and
      after-hours key drop are available: leave the key in the secure box by
      the front door with your name and phone number on the envelope.
  - title: "Services and starting prices"
    content: >-
      Synthetic oil change from $79.99, conventional from $54.99. Tire rotation
      $29.99, free with an oil change. Brake inspection is free; brake pad
      replacement starts at $189 per axle. Check-engine light diagnostic is
      $129, credited toward the repair if we do the work. Battery test is free.
      A/C performance check $89. Final prices depend on the vehicle, and we
      always call with an estimate before doing any work.
  - title: "Wait times, loaners and shuttle"
    content: >-
      Oil changes and tire rotations usually take under an hour and you're
      welcome to wait in our lounge with Wi-Fi. For longer repairs we offer a
      free local shuttle within 5 miles, and a limited number of loaner cars
      by reservation for jobs over one day.
  - title: "Warranty, payment and towing"
    content: >-
      Repairs carry a 24-month or 24,000-mile parts and labor warranty. We take
      all major cards, Apple Pay and Google Pay, and offer financing on repairs
      over $500. For towing we work with Summit Towing, which answers 24
      hours a day at 555-014-2200 and can bring the vehicle to the shop.

scheduling:
  bays: 3
  services:
    - { name: "Oil change", duration_minutes: 45 }
    - { name: "Tire rotation", duration_minutes: 30 }
    - { name: "Brake inspection", duration_minutes: 60 }
    - { name: "Check engine light diagnostic", duration_minutes: 90 }
    - { name: "Battery test and replacement", duration_minutes: 45 }
    - { name: "A/C performance check", duration_minutes: 60 }
  min_notice_hours: 1
  # Asked for before booking and saved on the appointment for the technician.
  # `vehicle` and `concern` share keys with qualification questions above, so
  # the receptionist reuses those answers instead of asking twice.
  booking_fields:
    - { key: vehicle, description: "Year, make and model of the vehicle" }
    - { key: mileage, description: "Approximate mileage" }
    - { key: concern, description: "What the customer wants done, or the symptoms in their words" }
  # Read back with the service when confirming ("oil change for your 2019
  # Toyota RAV4, ..."), the detail most worth the caller double-checking.
  confirm_detail: vehicle

escalation:
  mode: voicemail_callback
  triggers:
    - caller explicitly asks for a person or a technician
    - vehicle is unsafe to drive or needs a tow
    - question about an existing repair order or invoice
  callback_promise: "A service advisor will call you back within 30 minutes during shop hours."
  # Used instead while the shop is closed, so nobody is told "30 minutes" at
  # midnight. {next_open} is filled in from business_hours, e.g. "tomorrow
  # at 7:30 am". Change this if someone covers urgent calls after hours.
  after_hours_promise: "The shop is closed right now, so a service advisor will call you back when we open, {next_open}."

notifications:
  email_confirmation: true
  sms_confirmation: true

crm:
  enabled: true
  deal_pipeline: default
  deal_title: "{service} — {name}"
  stage_by_outcome:
    appointment_booked: appointmentscheduled
    lead_qualified: qualifiedtobuy
    default: appointmentscheduled
  contact_properties:
    vehicle: vehicle_description
  deal_min_score: 20

dashboard:
  owner_email: owner@ridgelineauto.example
  owner_name: Dana Whitfield
  owner_password: demo-password-not-for-production
