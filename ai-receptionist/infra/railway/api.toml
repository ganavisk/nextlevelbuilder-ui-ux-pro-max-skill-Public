# Railway service: api   (HTTP, runs migrations before each deploy)
# REFERENCE ONLY: Railway has deprecated Config as Code (railway.toml); new
# services can't opt in and existing files stop being read on 2026-12-01.
# Enter these settings in the service's dashboard (README.md, section 2) or
# port them to Railway's Infrastructure as Code (.railway/railway.ts).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"        # relative to the service's Root Directory (ai-receptionist/apps/api)

[deploy]
# `docker-entrypoint.sh <role>` works whether the platform replaces the image
# ENTRYPOINT with this command or appends it to it (both verified locally).
preDeployCommand = ["docker-entrypoint.sh migrate"]
startCommand = "docker-entrypoint.sh api"
# /readyz checks Postgres and Redis, so a deploy whose dependencies are
# misconfigured never receives traffic.
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
