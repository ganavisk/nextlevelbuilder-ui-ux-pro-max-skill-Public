# Railway service: confirmations   (appointment confirmation email + SMS)
# REFERENCE ONLY: Railway has deprecated Config as Code (railway.toml); new
# services can't opt in and existing files stop being read on 2026-12-01.
# Enter these settings in the service's dashboard (README.md, section 2) or
# port them to Railway's Infrastructure as Code (.railway/railway.ts).
# No HTTP surface, no migrations: only the api service migrates. See README.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"        # relative to the service's Root Directory (apps/api)

[deploy]
startCommand = "docker-entrypoint.sh confirmations"
# A queue consumer that exits for any reason should come back; the queue
# reclaims whatever job it was holding on startup.
restartPolicyType = "always"
