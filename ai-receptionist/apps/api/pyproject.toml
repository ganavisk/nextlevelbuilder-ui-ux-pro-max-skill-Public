[project]
name = "receptionist-api"
version = "0.1.0"
description = "AI Receptionist platform API — modular monolith"
requires-python = ">=3.11"  # 3.12 in Docker/CI; 3.11 tolerated for local dev
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "psycopg2-binary>=2.9",  # sync driver for Alembic migrations in production
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]  # aligned SQL DDL beats wrapped DDL
# FastAPI's dependency-injection pattern is Depends(...) as an argument
# default — that's the API, not a mutable-default bug B008 exists to catch.
"src/app/modules/*/*routes.py" = ["B008"]
"src/app/core/auth.py" = ["B008"]  # defines the Depends(...) targets themselves

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
